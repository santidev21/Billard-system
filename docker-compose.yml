name: billard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billiard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - billard-pg:/var/lib/postgresql/data
    networks:
      - billard-internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billiard"]
      interval: 5s
      timeout: 3s
      retries: 10

  billard:
    build: .
    container_name: billard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AllowedHosts=billard.santidev21.tech;localhost
      - ConnectionStrings__BilliardDatabase=Host=db;Database=billiard;Username=postgres;Password=${POSTGRES_PASSWORD};SslMode=Disable
      - Jwt__Key=${JWT_KEY}
      - Super__UserName=${SUPER_USERNAME}
      - Super__Password=${SUPER_PASSWORD}
    networks:
      - billard-net
      - billard-internal-net
    healthcheck:
      test: ["CMD", "curl", "-f", "--silent", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

volumes:
  billard-pg:

networks:
  billard-net:
    name: billard-net
    external: true
  billard-internal-net:
    name: billard-internal-net
    driver: bridge
    internal: true