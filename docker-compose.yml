services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: billiard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - billard-pg:/var/lib/postgresql/data
    networks:
      - billard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billiard"]
      interval: 5s
      timeout: 3s
      retries: 10

  billard:
    build: .
    container_name: billard
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AllowedHosts=billard.santidev21.tech;localhost
      - ConnectionStrings__BilliardDatabase=Host=db;Database=billiard;Username=postgres;Password=${POSTGRES_PASSWORD};SslMode=Disable
      - Jwt__Key=${JWT_KEY}
      - Super__UserName=${SUPER_USERNAME}
      - Super__Password=${SUPER_PASSWORD}
    networks:
      - billard-net

volumes:
  billard-pg:

networks:
  billard-net:
    name: billard-net
    driver: bridge
