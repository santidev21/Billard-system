@if (open && src) {
  <div class="overlay" (keydown.escape)="close()">
    <div class="card" role="dialog" aria-modal="true" aria-labelledby="replay-title">
      <header>
        <h3 id="replay-title">Repetición instantánea</h3>
        <button class="btn btn-outline close" (click)="close()" aria-label="Cerrar">✕</button>
      </header>
      <video #videoEl controls autoplay muted aria-label="Repetición instantánea de la jugada"></video>
      <div class="controls">
        <button class="btn btn-outline" (click)="playPause()">Play/Pause</button>
        <button class="btn btn-outline" (click)="setRate(0.25)">0.25x</button>
        <button class="btn btn-outline" (click)="setRate(0.5)">0.5x</button>
        <button class="btn btn-outline" (click)="setRate(1)">1x</button>
        <button class="btn btn-outline" (click)="stepFrames(-1)">« Frame</button>
        <button class="btn btn-outline" (click)="stepFrames(1)">Frame »</button>
      </div>
    </div>
  </div>
}
