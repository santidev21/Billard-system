@if (open) {
  <div class="overlay" (click)="close()" (keydown.escape)="close()">
    <div class="card" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="slide-confirm-title">
      <h3 id="slide-confirm-title">{{ title }}</h3>
      <p>{{ message }}</p>

      <div class="slider" (pointerdown)="onPointerDown($event)"
        role="slider" tabindex="0" aria-label="Deslizar para confirmar"
        aria-valuemin="0" [attr.aria-valuemax]="threshold" [attr.aria-valuenow]="dragX"
        (keydown)="onSliderKeyDown($event)">
        <div class="slider-fill" [style.width.%]="(dragX / threshold) * 100"></div>
        <div class="slider-hint">{{ completed ? 'Cerrado ✓' : 'Desliza para confirmar' }}</div>
        <div
          class="slider-thumb"
          [class.completed]="completed"
          [style.transform]="'translateX(' + dragX + 'px)'">
          {{ completed ? '✓' : '»' }}
        </div>
      </div>

      <div class="card-actions">
        <button class="btn btn-outline" (click)="close()">Cancelar</button>
      </div>
    </div>
  </div>
}
