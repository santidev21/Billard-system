<section>
  <h2 class="page-title">Catálogo de Productos</h2>

  @if (loading()) {
    <div class="spinner-center"><app-spinner [label]="'Cargando productos…'" /></div>
  }

  <div class="form glass">
    <input [(ngModel)]="newProductName" placeholder="Nombre del producto" />
    <input [(ngModel)]="newProductPrice" type="number" placeholder="Precio" />
    <button class="btn btn-primary" (click)="addProduct()" [disabled]="loading() || !newProductName.trim() || newProductPrice <= 0">
      @if (loading()) {
        <app-spinner [label]="'Guardando…'" />
      } @else {
        Agregar
      }
    </button>
  </div>

  <div class="cats">
    <div class="cat glass">
      <ul>
        @for (p of products(); track p.id) {
          <li>
            <span>{{ p.name }}</span>
            <b>${{ fmtMoney(p.price) }}</b>
            <button class="btn btn-outline mini-remove" (click)="removeProduct(p.id)">Eliminar</button>
          </li>
        } @empty {
          <li class="empty">Sin productos registrados</li>
        }
      </ul>
    </div>
  </div>
</section>
