<div class="admin-layout">
  <nav class="admin-nav">
    <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Dashboard</a>
    <a routerLink="/admin/catalog" routerLinkActive="active">Catálogo</a>
    <a routerLink="/admin/history" routerLinkActive="active">Historial</a>
    <a routerLink="/admin/audit" routerLinkActive="active">Auditoría</a>
  </nav>

  <div class="admin-body">
    <router-outlet />
  </div>
</div>

@if (callPopup(); as n) {
  <div class="popup-backdrop" (click)="closePopup()" (keydown.escape)="closePopup()">
    <div class="popup-card glass" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="call-popup-title">
      <div class="popup-icon" aria-hidden="true">🔔</div>
      <h3 id="call-popup-title">{{ popupTitle(n) }}</h3>
      <p>{{ popupBody(n) }}</p>
      <div class="popup-actions">
        <button class="btn btn-primary" (click)="attendFromPopup(n)">Atender ahora</button>
        <button class="btn btn-outline" (click)="closePopup()">Cerrar</button>
      </div>
    </div>
  </div>
}
