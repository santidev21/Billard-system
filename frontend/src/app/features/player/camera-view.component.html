@if (fill) {
  <div class="cam-fill">
    <video #liveVideo autoplay muted playsinline class="live" [class.hidden]="!cam.cameraOn()" aria-label="Vista en vivo de la mesa"></video>
    <div class="live-indicator on" [class.hidden]="!cam.cameraOn()">
      <span class="dot"></span> EN VIVO
    </div>

    @if (cam.devices().length > 1) {
      <select class="overlay-device" [class.hidden]="!cam.cameraOn()" aria-label="Seleccionar cámara" (change)="onDeviceChange($any($event.target).value)">
        @for (d of cam.devices(); track d.deviceId) {
          <option [value]="d.deviceId" [selected]="d.deviceId === cam.selectedDeviceId()">{{ d.label || 'Cámara' }}</option>
        }
      </select>
    }

    <button class="overlay-btn replay-btn" [class.hidden]="!cam.cameraOn()" (click)="openReplay()">Ver Repetición</button>
  </div>

  @if (cam.error()) {
    <div class="cam-error" role="alert">{{ cam.error() }}</div>
  }

  <app-replay-player [open]="replayOpen()" [src]="replayUrl()" (closed)="closeReplay()" />
} @else {
  @if (cam.available()) {
    <div class="cam glass">
      @if (cam.cameraOn()) {
        <div class="feed-wrap">
          <video #liveVideo autoplay muted playsinline class="live" aria-label="Vista en vivo de la mesa"></video>
          <div class="live-indicator on">
            <span class="dot"></span> EN VIVO
          </div>
        </div>
      } @else {
        <div class="cam-placeholder">
          <span class="cam-icon">📷</span>
          <span>Cámara apagada</span>
        </div>
      }

      <div class="controls">
        @if (cam.devices().length > 1) {
          <select class="device-select" aria-label="Seleccionar cámara" (change)="onDeviceChange($any($event.target).value)">
            @for (d of cam.devices(); track d.deviceId) {
              <option [value]="d.deviceId" [selected]="d.deviceId === cam.selectedDeviceId()">{{ d.label || 'Cámara' }}</option>
            }
          </select>
        }
        <button class="btn" [class.btn-primary]="!cam.cameraOn()" [class.btn-danger]="cam.cameraOn()" (click)="onToggle()">
          {{ cam.cameraOn() ? 'Apagar Cámara' : 'Encender Cámara' }}
        </button>
      </div>

      @if (cam.error()) {
        <div class="cam-error" role="alert">{{ cam.error() }}</div>
      }

      <div class="controls">
        <button class="btn btn-outline replay-btn" [disabled]="!cam.cameraOn()" (click)="openReplay()">Ver Repetición</button>
      </div>
    </div>

    <app-replay-player [open]="replayOpen()" [src]="replayUrl()" (closed)="closeReplay()" />
  }
}
