<section class="login-wrap">
  <form class="login-card glass" (ngSubmit)="submit()">
    <h2>Acceso</h2>
    <p class="hint">Ingresa los datos de tu local para acceder.</p>

    <label for="login-username">Nombre del local</label>
    <input id="login-username" [(ngModel)]="userName" name="userName" type="text" placeholder="Mi Billar" autocomplete="username" />

    <label for="login-password">Clave</label>
    <input id="login-password" [(ngModel)]="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" />

    @if (error(); as e) {
      <div class="error" role="alert">{{ e }}</div>
    }

    <button class="btn btn-primary" [disabled]="loading() || !userName || !password">
      @if (loading()) {
        <app-spinner [label]="'Ingresando…'" />
      } @else {
        Entrar
      }
    </button>

    <a class="forgot-link" routerLink="/forgot-password">¿Olvidaste tu clave?</a>

    <div class="divider"><span>o</span></div>

    <button type="button" class="btn btn-outline" routerLink="/t/demo/free">Jugar modo libre</button>
  </form>
</section>
