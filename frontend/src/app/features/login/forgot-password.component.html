<section class="login-wrap">
  <form class="login-card glass" (ngSubmit)="submit()">
    <h2>Recuperar clave</h2>

    @if (sent()) {
      <p class="hint">Si el local existe, solicita el código de recuperación a tu administrador.</p>
    } @else {
      <p class="hint">Ingresa el nombre de tu local para solicitar una recuperación.</p>

      <label>Nombre de tu local</label>
      <input [(ngModel)]="userName" name="userName" type="text" placeholder="Mi Billar" autocomplete="username" />

      @if (error(); as e) {
        <div class="error">{{ e }}</div>
      }

      <button class="btn btn-primary" [disabled]="loading() || !userName">
        @if (loading()) {
          <app-spinner [label]="'Enviando…'" />
        } @else {
          Solicitar código
        }
      </button>
    }

    <a class="back-link" routerLink="/login">Volver al login</a>
  </form>
</section>
