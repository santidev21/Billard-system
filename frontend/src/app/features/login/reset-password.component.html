<section class="login-wrap">
  <form class="login-card glass" (ngSubmit)="submit()">
    <h2>Restablecer clave</h2>
    <p class="hint">Ingresa los datos para crear una nueva clave.</p>

    <label>Nombre de tu local</label>
    <input [(ngModel)]="userName" name="userName" type="text" placeholder="Mi Billar" autocomplete="username" />

    <label>Código de recuperación</label>
    <input [(ngModel)]="code" name="code" type="text" placeholder="Código" autocomplete="one-time-code" />

    <label>Nueva clave</label>
    <input [(ngModel)]="newPassword" name="newPassword" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />

    @if (error(); as e) {
      <div class="error">{{ e }}</div>
    }

    <button class="btn btn-primary" [disabled]="loading() || !userName || !code || !newPassword">
      @if (loading()) {
        <app-spinner [label]="'Restableciendo…'" />
      } @else {
        Restablecer clave
      }
    </button>

    <a class="back-link" routerLink="/login">Volver al login</a>
  </form>
</section>
