<section class="login-wrap">
  <form class="login-card glass" (ngSubmit)="submit()">
    <h2>Restablecer clave</h2>
    <p class="hint">Ingresa los datos para crear una nueva clave.</p>

    <label for="reset-username">Nombre de tu local</label>
    <input id="reset-username" [(ngModel)]="userName" name="userName" type="text" placeholder="Mi Billar" autocomplete="username" />

    <label for="reset-code">Código de recuperación</label>
    <input id="reset-code" [(ngModel)]="code" name="code" type="text" placeholder="Código" autocomplete="one-time-code" />

    <label for="reset-password">Nueva clave</label>
    <input id="reset-password" [(ngModel)]="newPassword" name="newPassword" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" />

    @if (error(); as e) {
      <div class="error" role="alert">{{ e }}</div>
    }

    <button class="btn btn-primary" [disabled]="loading() || !userName || !code || !newPassword">
      @if (loading()) {
        <app-spinner [label]="'Restableciendo…'" />
      } @else {
        Restablecer clave
      }
    </button>

    <a class="back-link" routerLink="/login">Volver al login</a>
  </form>
</section>
