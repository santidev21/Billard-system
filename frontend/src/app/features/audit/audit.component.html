<section>
  <h2 class="page-title">Registro de Auditoría</h2>
  @if (loading()) {
    <div class="spinner-center"><app-spinner [label]="'Cargando auditoría…'" /></div>
  }
  <div class="glass list">
    @for (log of logs(); track log.id) {
      <div class="entry">
        <div class="head">
          <span class="pill">{{ log.actionType }}</span>
          <time [attr.datetime]="log.createdAt">{{ time(log.createdAt) }}</time>
        </div>
        <p>{{ log.description }}</p>
      </div>
    } @empty {
      <p class="empty">Sin registros</p>
    }
  </div>
</section>
