name: CodeQL

# Static application security testing (SAST) via GitHub CodeQL.
# Free for public repositories.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build-mode: none extracts tracked source files only — no build, no
      # compilation. This deliberately excludes compiler/source-generator output
      # under obj/ (e.g. Microsoft.AspNetCore.OpenApi's OpenApiXmlCommentSupport
      # generated at obj/Debug/net10.0/generated/...), which otherwise floods the
      # results with alerts in code nobody edits. `paths-ignore` in the CodeQL
      # config does NOT apply to compiled languages, so the exclusion happens here.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
