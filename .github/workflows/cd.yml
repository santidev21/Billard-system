name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Accept both raw private key and base64-encoded key
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > /tmp/_key_input
          if grep -q "BEGIN OPENSSH PRIVATE KEY" /tmp/_key_input 2>/dev/null || grep -q "BEGIN RSA PRIVATE KEY" /tmp/_key_input 2>/dev/null; then
            cp /tmp/_key_input ~/.ssh/deploy_key
          else
            base64 -d /tmp/_key_input > ~/.ssh/deploy_key 2>/dev/null || cp /tmp/_key_input ~/.ssh/deploy_key
          fi
          # Fix Windows CRLF if pasted from PowerShell
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null || (echo "Deploy key invalid - check VPS_SSH_PRIVATE_KEY secret" && cat ~/.ssh/deploy_key | head -1 && exit 1)
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          rm -f /tmp/_key_input

      - name: Deploy to VPS
        env:
          SSH_KEY: ~/.ssh/deploy_key
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/billard && chmod +x ./deploy/deploy.sh && ./deploy/deploy.sh deploy'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        if: success()
        run: echo "Deployed commit ${{ github.sha }} via deploy.sh"
