name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
        working-directory: backend
      - name: Verify formatting
        run: dotnet format whitespace BilliardSystem.slnx --verify-no-changes --no-restore
        working-directory: backend
      - run: dotnet build --no-restore -c Release
        working-directory: backend
      - name: Run backend tests with coverage
        run: >
          dotnet test --no-build -c Release
          --collect:"XPlat Code Coverage"
          --settings ../coverlet.runsettings
          --logger "trx;LogFileName=results.trx"
        working-directory: backend
      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            backend/**/TestResults/*.trx
            backend/**/coverage.cobertura.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Lint (ESLint)
        run: npm run lint
        working-directory: frontend
      - name: Verify formatting (Prettier)
        run: npm run format:check
        working-directory: frontend
      - name: Run frontend tests with coverage
        run: npm run test:ci
        working-directory: frontend
      - name: Build (production)
        run: npm run build -- --configuration production
        working-directory: frontend
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy fs scan (deps, secrets, IaC)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Setup SSH
        env:
          SSH_DEPLOY_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Raw private key or base64 (handles multiline secrets safely)
          if printf '%s\n' "$SSH_DEPLOY_KEY" | grep -q '^-----BEGIN'; then
            printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploy_key
          else
            printf '%s\n' "$SSH_DEPLOY_KEY" | base64 -d > ~/.ssh/deploy_key
          fi
          # Strip Windows CRLF
          sed -i 's/\r$//' ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -l -f ~/.ssh/deploy_key >/dev/null 2>&1 || { echo "Deploy key invalid - check VPS_SSH_PRIVATE_KEY secret"; exit 1; }
          echo "Key fingerprint in secret:"
          ssh-keygen -l -f ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to VPS
        env:
          SSH_KEY: ~/.ssh/deploy_key
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh -i "$SSH_KEY" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            'cd /opt/billard && git fetch origin main && git reset --hard origin/main && chmod +x ./deploy/deploy.sh && ./deploy/deploy.sh deploy'

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Deployment summary
        if: success()
        run: echo "Deployed commit ${{ github.sha }} via deploy.sh"