# go2rtc — base config for the Billard local camera bridge.
# Streams are registered at runtime by the camera-bridge (PUT /api/streams);
# go2rtc persists them in its writable /config volume, so this file only needs
# to pin the listeners. See docker-compose.camera.yml.

log:
  level: info

api:
  listen: "127.0.0.1:1984"

rtsp:
  listen: "127.0.0.1:8554"

webrtc:
  listen: ":8555"
